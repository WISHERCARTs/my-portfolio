<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#0b2a2a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#5eead4" stroke-width="2">
    <circle cx="690" cy="90" r="140" fill="none"/>
    <circle cx="90" cy="520" r="170" fill="none"/>
  </g>
  <!-- connectors -->
  <g stroke="#5eead4" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="400,200 400,235 215,235 215,270"/>
    <polyline points="400,200 400,235 585,235 585,270"/>
    <polyline points="215,350 215,372 400,372"/>
    <polyline points="585,350 585,372 400,372"/>
  </g>
  <!-- coordinator -->
  <rect x="300" y="130" width="200" height="70" rx="14" fill="#0d9488"/>
  <text x="400" y="173" text-anchor="middle" font-family="monospace" font-size="22" fill="#ecfeff" font-weight="700">coordinator</text>
  <!-- researcher -->
  <rect x="115" y="270" width="200" height="80" rx="14" fill="#0b1220" stroke="#5eead4" stroke-width="4"/>
  <text x="215" y="308" text-anchor="middle" font-family="monospace" font-size="21" fill="#ccfbf1" font-weight="700">researcher</text>
  <text x="215" y="334" text-anchor="middle" font-family="monospace" font-size="14" fill="#5eead4">search + cite</text>
  <!-- fact checker -->
  <rect x="485" y="270" width="200" height="80" rx="14" fill="#0b1220" stroke="#5eead4" stroke-width="4"/>
  <text x="585" y="308" text-anchor="middle" font-family="monospace" font-size="21" fill="#ccfbf1" font-weight="700">fact_checker</text>
  <text x="585" y="334" text-anchor="middle" font-family="monospace" font-size="14" fill="#5eead4">verify draft</text>
  <!-- answer -->
  <rect x="320" y="372" width="160" height="40" rx="10" fill="#0b1220" stroke="#5eead4" stroke-width="3"/>
  <text x="400" y="399" text-anchor="middle" font-family="monospace" font-size="17" fill="#ccfbf1" font-weight="700">answer [S1] [S2]</text>
  <text x="400" y="490" text-anchor="middle" font-family="monospace" font-size="30" fill="#ecfeff" font-weight="700">Thai RAG Agents</text>
  <text x="400" y="526" text-anchor="middle" font-family="monospace" font-size="18" fill="#99f6e4">Multi-agent Q&amp;A on Google ADK</text>
</svg>
