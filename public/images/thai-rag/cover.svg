<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#a5b4fc" stroke-width="2">
    <circle cx="680" cy="500" r="180" fill="none"/>
    <circle cx="110" cy="90" r="130" fill="none"/>
  </g>
  <!-- documents -->
  <g transform="translate(250,250)" stroke="#a5b4fc" stroke-width="4" fill="#0b1220">
    <rect x="-70" y="-80" width="110" height="140" rx="10"/>
    <rect x="-55" y="-65" width="110" height="140" rx="10"/>
    <g stroke-width="3" stroke-linecap="round">
      <line x1="-38" y1="-40" x2="38" y2="-40"/>
      <line x1="-38" y1="-18" x2="38" y2="-18"/>
      <line x1="-38" y1="4" x2="20" y2="4"/>
      <line x1="-38" y1="26" x2="38" y2="26"/>
    </g>
  </g>
  <!-- arrow -->
  <g stroke="#a5b4fc" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="345" y1="250" x2="440" y2="250"/>
    <polyline points="425,235 440,250 425,265"/>
  </g>
  <!-- ranked results with a check -->
  <g transform="translate(540,250)">
    <rect x="-70" y="-80" width="150" height="40" rx="8" fill="#6366f1"/>
    <rect x="-70" y="-25" width="150" height="40" rx="8" fill="#0b1220" stroke="#a5b4fc" stroke-width="3"/>
    <rect x="-70" y="30" width="150" height="40" rx="8" fill="#0b1220" stroke="#a5b4fc" stroke-width="3"/>
    <text x="-55" y="-52" font-family="monospace" font-size="20" fill="#eef2ff" font-weight="700">#1 [1]</text>
    <text x="-55" y="3" font-family="monospace" font-size="20" fill="#c7d2fe">#2</text>
    <text x="-55" y="58" font-family="monospace" font-size="20" fill="#c7d2fe">#3</text>
    <polyline points="40,-62 52,-50 70,-72" fill="none" stroke="#eef2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="30" fill="#eef2ff" font-weight="700">Thai RAG + Evaluation</text>
  <text x="400" y="456" text-anchor="middle" font-family="monospace" font-size="18" fill="#c7d2fe">BM25 vs Gemini embeddings vs hybrid</text>
</svg>
