    <path d="M190 192 H220 V272 H190 M220 232 H250"/>
    <path d="M190 362 H220 V442 H190 M220 402 H250"/>
    <rect x="250" y="210" width="120" height="44" rx="8"/>
    <rect x="250" y="380" width="120" height="44" rx="8"/>
  </g>

  <!-- the assistant's chat -->
